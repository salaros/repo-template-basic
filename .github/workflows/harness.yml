name: harness

# Proves the agent harness itself: the hook suite (.agents/hooks/test.js, which also runs the
# skills roster check), and the documentation chain validator. Runs on the two platforms the
# harness claims to support without a shell adapter. Nothing here depends on the project's own
# stack, so this workflow needs no changes when a stack lands in src/.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable symlinks (matches Getting started, Windows only)
        run: git config --global core.symlinks true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Hook suite (harness fixtures + skill roster check)
        run: node .agents/hooks/test.js

      - name: Documentation chain
        run: node scripts/docs-check.js
