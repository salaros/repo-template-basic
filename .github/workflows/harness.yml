name: harness

# Proves the agent harness itself: the hook suite (.agents/hooks/test.js, which also checks that
# every skill in skills-lock.json is on disk), and the documentation chain validator. The pre-push
# formatter is not run here because no stack has landed yet; when one does, add the format command
# from its scripts/stacks.tsv row, since a local hook can always be skipped with --no-verify.
# Runs on the two platforms the
# harness claims to support without a shell adapter. Nothing here depends on the project's own
# stack, so this workflow needs no changes when a stack lands in src/.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable symlinks (matches Getting started, Windows only)
        run: git config --global core.symlinks true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Hook suite (harness fixtures + skills on disk)
        run: node .agents/hooks/test.js

      - name: Documentation chain
        run: node scripts/docs-check.js
